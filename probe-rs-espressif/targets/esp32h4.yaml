name: esp32h4
manufacturer:
  id: 0x12
  cc: 0xc
chip_detection:
- !Espressif
  idcode: 0x1cc25
  magic_address: 0x40001000
  variants: {} # IDCODE is unique to ESP32-H4
variants:
- name: esp32h4
  cores:
  - name: cpu0
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  - name: cpu1
    type: riscv
    core_access_options: !Riscv
      hart_id: 1
  memory_map:
  - !Nvm
    name: 32 MB Max addressable Flash
    range:
      start: 0x0
      end: 0x2000000
    cores:
    - cpu0
    - cpu1
    access:
      execute: false
      boot: true
  - !Generic
    name: ROM
    range:
      start: 0x40000000
      end: 0x40020000
    cores:
    - cpu0
    - cpu1
  - !Ram
    name: Internal SRAM
    range:
      start: 0x40808000
      end: 0x40868000
    cores:
    - cpu0
    - cpu1
  - !Nvm
    name: External flash (Read Only)
    range:
      start: 0x42000000
      end: 0x44000000
    cores:
    - cpu0
    - cpu1
    is_alias: true
  flash_algorithms:
  - esp32h4-flashloader
  jtag:
    scan_chain:
    - name: main
      ir_len: 5
  default_binary_format: idf
flash_algorithms:
- name: esp32h4-flashloader
  description: A flash loader for the esp32h4.
  default: true
  instructions: 
  load_address: 0x40810010
  data_load_address: 0x40820000
  pc_init: 0x39a
  pc_uninit: 0x772
  pc_program_page: 0x488
  pc_erase_sector: 0x324
  pc_erase_all: 0x304
  pc_verify: 0x7dc
  pc_blank_check: 0x1bc
  pc_read: 0x540
  vendor_functions:
    ChipRevision: 0x7c4
    FlashSize: 0x7cc
    Signatures_md5: 0x7d4
  data_section_offset: 0xee4
  rtt_location: 0x40833c60
  rtt_poll_interval: 500
  flash_properties:
    address_range:
      start: 0x0
      end: 0x2000000
    page_size: 0x4000
    erased_byte_value: 0xff
    program_page_timeout: 2000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x10000
      address: 0x0
  cores:
  - cpu0
  stack_overflow_check: false
  transfer_encoding: miniz
