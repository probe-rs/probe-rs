name: esp32h4
manufacturer:
  id: 0x12
  cc: 0xc
chip_detection:
- !Espressif
  idcode: 0x1cc25
  variants:
    0x0: esp32h4
variants:
- name: esp32h4
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
  memory_map:
  - !Nvm
    name: 32 MB Max addressable Flash
    range:
      start: 0x0
      end: 0x2000000
    cores:
    - main
    access:
      execute: false
      boot: true
  - !Generic
    name: ROM
    range:
      start: 0x40000000
      end: 0x40050000
    cores:
    - main
  - !Ram
    name: Internal SRAM
    range:
      start: 0x40810000
      end: 0x40860000
    cores:
    - main
  - !Ram
    name: LP SRAM
    range:
      start: 0x50000000
      end: 0x50004000
    cores:
    - main
  - !Nvm
    name: External flash (Read Only)
    range:
      start: 0x42000000
      end: 0x44000000
    cores:
    - main
    is_alias: true
  flash_algorithms:
  - esp32h4-flashloader
  jtag:
    scan_chain:
    - name: main
      ir_len: 5
  default_binary_format: idf
flash_algorithms:
- name: esp32h4-flashloader
  description: A flash loader for the esp32h4.
  default: true
  instructions: 
  load_address: 0x40810010
  data_load_address: 0x40820000
  pc_init: 0x38a
  pc_uninit: 0x5d6
  pc_program_page: 0x476
  pc_erase_sector: 0x314
  pc_erase_all: 0x2f4
  pc_verify: 0x638
  pc_blank_check: 0x1ac
  pc_read: 0x52a
  vendor_functions:
    ChipRevision: 0x628
    FlashSize: 0x630
  data_section_offset: 0xd60
  rtt_location: 0x40832c08
  rtt_poll_interval: 500
  flash_properties:
    address_range:
      start: 0x0
      end: 0x2000000
    page_size: 0x4000
    erased_byte_value: 0xff
    program_page_timeout: 2000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x10000
      address: 0x0
  cores:
  - main
  transfer_encoding: miniz
