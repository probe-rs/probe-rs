name: esp32c61
manufacturer:
  id: 0x12
  cc: 0xc
chip_detection:
- !Espressif
  idcode: 0x14c25
  magic_address: 0x40001000
  variants: {} # IDCODE is unique to ESP32-C61
variants:
- name: esp32c61
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
  memory_map:
  - !Nvm
    name: 32 MB Max addressable Flash
    range:
      start: 0x0
      end: 0x2000000
    cores:
    - main
    access:
      execute: false
      boot: true
  - !Generic
    name: ROM
    range:
      start: 0x40000000
      end: 0x40040000
    cores:
    - main
  - !Ram
    range:
      start: 0x40800000
      end: 0x40850000
    cores:
    - main
  - !Nvm
    name: External flash (Read Only)
    range:
      start: 0x42000000
      end: 0x44000000
    cores:
    - main
    is_alias: true
  flash_algorithms:
  - esp32c61-flashloader
  jtag:
    scan_chain:
    - name: main
      ir_len: 5
  default_binary_format: idf
flash_algorithms:
- name: esp32c61-flashloader
  description: A flash loader for the esp32c61.
  default: true
  instructions: 
  load_address: 0x40810000
  data_load_address: 0x40820000
  pc_init: 0x34a
  pc_uninit: 0x9ce
  pc_program_page: 0x4c2
  pc_erase_sector: 0x2ca
  pc_erase_all: 0x2aa
  pc_read: 0x772
  vendor_functions:
    FlashSize: 0xa28
    Signatures_md5: 0xa30
    ChipRevision: 0xa20
  data_section_offset: 0xdc0
  rtt_location: 0x40833b60
  rtt_poll_interval: 500
  flash_properties:
    address_range:
      start: 0x0
      end: 0x2000000
    page_size: 0x4000
    erased_byte_value: 0xff
    program_page_timeout: 2000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x10000
      address: 0x0
  cores:
  - main
  stack_overflow_check: false
  transfer_encoding: miniz
