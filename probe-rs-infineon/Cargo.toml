[package]
name = "probe-rs-infineon"
description = "Infineon AURIX (TriCore) support built on top of the probe-rs crate"
version.workspace = true
edition.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# The MCD probe: loads an MCD API v1.1 library (for example mcd_tas.dll) at run time.
mcd = ["dep:libloading"]

[dependencies]
probe-rs.workspace = true
probe-rs-target.workspace = true

bincode = { version = "2", features = ["serde"] }
docsplay.workspace = true
libloading = { version = "0.8", optional = true }
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
tracing = "0.1"

[dev-dependencies]
probe-rs-debug = { version = "0.32.0", path = "../probe-rs-debug" }
base64 = "0.22"
serde_json = "1"
typed-path = "0.12.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
probe-rs-target = { workspace = true, features = ["bincode"] }

[lints]
workspace = true
