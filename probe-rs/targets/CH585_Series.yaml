name: CH585 Series
chip_detection:
- !WchLink
  # Only used when the probe firmware reports a chip id in its `AttachChip`
  # response. Some WCH-Link firmware leaves that field zero, in which case
  # auto-detection cannot distinguish the variant and `--chip` is required.
  #
  # CH584 is not listed: sources disagree on its id byte (WCH-LinkUtility uses
  # 0x84, the ch5xx-data notes say 0x92, which collides with CH592 and CH581),
  # so it is reachable by name only.
  mask: 0xff000000
  variants:
    0x93000000: CH585
variants:
- name: CH585
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  # Code flash: 448 KiB, erased in 4 KiB blocks, programmed a dword at a time.
  # The data flash that follows it (32 KiB at 0x70000) is not mapped: it is
  # reached through the ISP library and is not readable in the code address
  # space, so exposing it as a loadable region would be misleading.
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x70000
    cores:
    - main
  # 128 KiB (96 KiB + 32 KiB retention) at 0x20000000.
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20020000
    cores:
    - main
- name: CH584
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x70000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20018000
    cores:
    - main
