- name: ch32-v1-usr-native
  description: "WCH-Link native fastprogram loader for CH32V103. NOT a CMSIS flash algorithm: its address range is intentionally empty so it is never selected for target-side flashing; the WCH-Link native flashing path looks it up by name and streams its `instructions` blob to the probe. the `pc_*` fields only exist so generic algorithm validation passes; they are never used (the blob is position-independent, the probe firmware chooses where it runs)."
  default: false
  instructions: 
  pc_program_page: 0x0
  pc_erase_sector: 0x0
  data_section_offset: 0x0
  flash_properties:
    address_range:
      start: 0x0
      end: 0x0
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x100
      address: 0x0
