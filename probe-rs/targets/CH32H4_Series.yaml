flash_algorithms:
- name: ch32-h4-opt
  description: ch32-h4-opt
  default: true
  instructions: 
  load_address: 0x200a0020
  pc_init: 0x48
  pc_uninit: 0xfc
  pc_program_page: 0x9c
  pc_erase_sector: 0x4
  pc_erase_all: 0x0
  data_section_offset: 0x128
  flash_properties:
    address_range:
      start: 0x1ffff800
      end: 0x1ffff900
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x100
      address: 0x0
- name: ch32-h4-sys
