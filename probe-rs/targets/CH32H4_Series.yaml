  variants:
    0x4150050d: CH32H415REU6
    0x4160050d: CH32H416RDU6
    0x4171050d: CH32H417MEU6
    0x4170050d: CH32H417QEU6
    0x4172050d: CH32H417WEU6
variants:
- name: CH32H415REU6
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: USR_LEGACY
    range:
      start: 0x0
      end: 0xf0000
    cores:
    - main
    is_alias: true
  - !Nvm
    name: USR
    range:
      start: 0x8000000
      end: 0x80f0000
    cores:
    - main
  - !Nvm
    name: SYS
    range:
      start: 0x1fff0000
      end: 0x1fffe000
    cores:
    - main
    is_alias: true
  - !Nvm
    name: VND
    range:
      start: 0x1ffff700
      end: 0x1ffff800
    cores:
    - main
    is_alias: true
    access:
      write: false
      execute: false
  - !Nvm
    name: OPT
    range:
      start: 0x1ffff800
      end: 0x1ffff900
    cores:
    - main
    is_alias: true
    access:
      execute: false
  - !Ram
    name: ITCM
    range:
      start: 0x200a0000
      end: 0x200c0000
    cores:
    - main
  - !Ram
    name: DTCM
    range:
      start: 0x200c0000
      end: 0x20100000
    cores:
    - main
  - !Ram
    name: SRAM_SHARED
    range:
      start: 0x20100000
      end: 0x20180000
    cores:
    - main
  flash_algorithms:
  - ch32-h4-usr
  - ch32-h4-usr-legacy
  - ch32-h4-sys
  - ch32-h4-opt
  - ch32-h4-usr-native
