# Generated by target-gen from Keil.S32K118_SDK_DFP 1.2.1, then edited by hand: the pack
# declares RAM per <variant>, which the cmsis-pack parser drops (pyocd/cmsis-pack-manager#252),
# so IRAM1 and IRAM2 are copied from the pack. SRAM_L (1 KiB below
# 0x20000000) is not in the pack's memory list; it is taken from the S32K118 linker scripts
# in the same pack. Re-add these after regenerating.
name: S32K11 Series
manufacturer:
  id: 0x15
  cc: 0x0
generated_from_pack: true
pack_file_release: 1.2.1
variants:
- name: S32K118xxxxMLFx
  cores:
  - name: main
    type: armv6m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    name: IROM1
    range:
      start: 0x0
      end: 0x40000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Ram
    name: SRAM_L
    range:
      start: 0x1ffffc00
      end: 0x20000000
    cores:
    - main
  - !Ram
    name: IRAM1
    range:
      start: 0x20000000
      end: 0x20003000
    cores:
    - main
  - !Ram
    name: IRAM2
    range:
      start: 0x20003000
      end: 0x20005800
    cores:
    - main
  flash_algorithms:
  - s32k118_p256_2kb_sec
