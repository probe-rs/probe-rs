name: MC1322x Series
manufacturer:
  id: 0x0E  # Freescale (NXP's own JEP106 code, 0x15, is a different one)
  cc: 0x0
generated_from_pack: false
variants:
# MC13224V and MC13226V differ only in their ROM contents; the memory layout is the same.
#
# Address 0x0 is the boot ROM (which also holds the NVM driver routines), not flash. The 128 KB
# NVM has no CPU address: it is only accessible through the ROM's nvm_* routines, and on reset
# the boot ROM copies the image to RAM at 0x00400000 and runs it there. The `FLASH` region is
# therefore a logical NVM offset space, and the flash algorithm verifies through the ROM's
# nvm_verify (`pc_verify`) instead of reading the region back.
- name: MC13224V
  cores:
  - name: main
    type: armv4t
    core_access_options: !Armv4t
      jtag_tap: 0
  jtag:
    force_scan_chain: true
    scan_chain:
    - name: main
      ir_len: 4
    # The EmbeddedICE logic only responds (beyond the IDCODE) with nTRST/nSRST driven. On FTDI
    # adapters wired like the Axiom AXM-0432 (e.g. the Redbee Econotag) these are GPIOs on
    # ACBUS2/ACBUS3; this mirrors OpenOCD's `interface/ftdi/axm0432.cfg`
    # (`layout_init 0x0c08 0x0c2b`), which also drives ADBUS5 low.
    gpio_reset:
      ntrst:
        bit: 11 # ACBUS3 / GPIOH3
        idle_high: true
      nsrst:
        bit: 10 # ACBUS2 / GPIOH2
        idle_high: true
      extra_outputs:
      - bit: 5 # ADBUS5 / GPIOL1
        idle_high: false
  memory_map:
  - !Nvm
    name: FLASH
    range:
      start: 0x00000000
      # 128 KB minus the top 4 KB sector (0x1f000-0x1ffff), which holds factory data: libmc1322x
      # never erases it, and the flash algorithm's chip erase keeps it.
      end: 0x0001F000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Ram
    name: RAM
    range:
      start: 0x00400000
      end: 0x00418000  # 96 KB (MC1322x Reference Manual, libmc1322x's mc1322x.lds)
    cores:
    - main
  flash_algorithms:
  - mc1322x-flash-algorithm

- name: MC13226V
  cores:
  - name: main
    type: armv4t
    core_access_options: !Armv4t
      jtag_tap: 0
  jtag:
    force_scan_chain: true
    scan_chain:
    - name: main
      ir_len: 4
    # See MC13224V.
    gpio_reset:
      ntrst:
        bit: 11 # ACBUS3 / GPIOH3
        idle_high: true
      nsrst:
        bit: 10 # ACBUS2 / GPIOH2
        idle_high: true
      extra_outputs:
      - bit: 5 # ADBUS5 / GPIOL1
        idle_high: false
  memory_map:
  - !Nvm
    name: FLASH
    range:
      start: 0x00000000
      # 128 KB minus the top 4 KB sector (0x1f000-0x1ffff), which holds factory data: libmc1322x
      # never erases it, and the flash algorithm's chip erase keeps it.
      end: 0x0001F000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Ram
    name: RAM
    range:
      start: 0x00400000
      end: 0x00418000  # 96 KB (MC1322x Reference Manual, libmc1322x's mc1322x.lds)
    cores:
    - main
  flash_algorithms:
  - mc1322x-flash-algorithm

flash_algorithms:
- name: mc1322x-flash-algorithm
  description: MC1322x Flash Algorithm using ROM routines
  default: true
  # Built with `target-gen elf` from `mc1322x-flash-algorithm`, which calls the boot ROM's NVM
  # routines. 32 sectors of 4 KB (libmc1322x's nvm.h).
  instructions: 
  pc_init: 0x8dc
  pc_uninit: 0xb1c
  pc_program_page: 0xa80
  pc_erase_sector: 0x860
  pc_erase_all: 0x800
  pc_verify: 0xb48
  data_section_offset: 0x400c10
  # Set explicitly: by default the page buffers go right after `instructions`, on top of the
  # algorithm's DeviceData (0x400c10-0x400cc0) and its runtime statics (PrgData,
  # 0x400cc0-0x400cc5); overwriting the statics breaks ProgramPage. 0x400cc8 is the end of
  # PrgData, 8-byte aligned.
  data_load_address: 0x400cc8
  flash_properties:
    address_range:
      start: 0x0
      # Excludes the factory sector, like the `FLASH` regions.
      end: 0x1F000
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
