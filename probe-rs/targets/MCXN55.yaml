name: MCXN55
manufacturer:
  id: 0x15
  cc: 0x0
# Based on NXP device-family packs 26.09.00.
# N55 uses the MCXNP184M150F70RM memory layout and sequences in its packs.
# CPU1 remains omitted: ROM holds it in reset, and debug/reset sequences
# currently support CPU0 only (RM 17.4.1.95-96).
variants:
- name: MCXN556SCDF
  cores:
  - name: cm33_core0
    type: armv8m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    name: PROGRAM_FLASH0
    range:
      start: 0x0
      end: 0x80000
    cores:
    - cm33_core0
    access:
      write: false
      boot: true
  - !Nvm
    name: PROGRAM_FLASH1
    range:
      start: 0x80000
      end: 0x100000
    cores:
    - cm33_core0
    access:
      write: false
      boot: true
  - !Generic
    name: BootROM
    range:
      start: 0x3000000
      end: 0x3040000
    cores:
    - cm33_core0
    access:
      write: false
  - !Ram
    name: SRAMX
    range:
      start: 0x4000000
      end: 0x4018000
    cores:
    - cm33_core0
    access:
      execute: true
  - !Nvm
    name: PROGRAM_FLASH_alias0
    range:
      start: 0x10000000
      end: 0x10080000
    cores:
    - cm33_core0
    is_alias: true
    access:
      write: false
  - !Nvm
    name: PROGRAM_FLASH_alias1
    range:
      start: 0x10080000
      end: 0x10100000
