name: CH570 / CH572 Series
chip_detection:
- !WchLink
  mask: 0xff000000
  variants:
    0x70000000: CH570
    0x72000000: CH572
variants:
- name: CH570
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x3c000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20003000
    cores:
    - main
  flash_algorithms:
  - ch570-code-flash
- name: CH572
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x3c000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20003000
    cores:
    - main
  flash_algorithms:
  - ch570-code-flash
flash_algorithms:
- name: ch570-code-flash
  description: CH570/CH572 CodeFlash
  default: true
  instructions: 
  load_address: 0x20000008
  pc_init: 0x0
  pc_uninit: 0x18
  pc_program_page: 0x284
  pc_erase_sector: 0x24
  pc_erase_all: 0x25a
  data_section_offset: 0x548
  flash_properties:
    address_range:
      start: 0x0
      end: 0x3c000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 100
    erase_sector_timeout: 1000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
