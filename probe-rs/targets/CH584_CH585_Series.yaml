name: CH584/CH585 Series
variants:
- name: CH584
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x70000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20018000
    cores:
    - main
  flash_algorithms:
  - ch5xx-code-flash
- name: CH585
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x70000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20020000
    cores:
    - main
  flash_algorithms:
  - ch5xx-code-flash
flash_algorithms:
- name: ch5xx-code-flash
  description: CH584/CH585 CodeFlash
  default: true
  instructions: 
  load_address: 0x20000008
  pc_init: 0x0
  pc_uninit: 0x4a
  pc_program_page: 0x32a
  pc_erase_sector: 0x56
  pc_erase_all: 0x1b0
  data_section_offset: 0x508
  flash_properties:
    address_range:
      start: 0x0
      end: 0x70000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 500
    erase_sector_timeout: 1000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
