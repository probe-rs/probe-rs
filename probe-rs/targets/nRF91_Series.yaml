# MANUAL EDIT: The nrf91xx and nrf91xx_uicr flash algorithms from Nordic's CMSIS-Pack are
# patched to feed a running watchdog, like the nRF52 algorithm does. A running WDT survives
# the soft reset done before flashing, so without this it resets the chip mid-flash.
#
# The code below is appended to each original blob (whose length is a multiple of 4):
# - The first instruction of the NVMC wait-for-ready routine (offset 0x4d0 in nrf91xx,
#   0x41c in nrf91xx_uicr) is replaced with `b.w wait_ready_feed_wdt`.
# - pc_verify points at verify_feed_wdt instead of the original verify routine (originally
#   0x331 in nrf91xx, 0x275 in nrf91xx_uicr), which verify_feed_wdt then branches to.
#
# Feeding starts with the first algorithm call. With WDT CONFIG.HALT=Run the WDT keeps counting
# while probe-rs halts the core, resets it and loads the algorithm, so its timeout must exceed
# that time plus the firmware's feed interval. On an nRF9151 with a J-Link, a 500 ms timeout
# worked and 400 ms did not. With CONFIG.HALT=Pause, a 50 ms timeout worked.
#
#   wait_ready_feed_wdt:            @ clobbers r0, r1 and flags, like the original routine
#       push    {r2, r3, lr}
#       @ Feed before checking READY: it usually still reads 1 right after a flash write,
#       @ so feeding only while it reads 0 would never feed.
#   1:  bl      feed_wdt
#       ldr     r0, =0x50039400     @ address of NVMC.READY
#       ldr     r1, [r0]            @ read NVMC.READY
#       cmp     r1, #0
#       beq     1b
#       pop     {r2, r3, pc}
#   verify_feed_wdt:
#       push    {r1, r2, r3, lr}
#       bl      feed_wdt
#       pop     {r1, r2, r3, lr}
#       b.w     original_verify     @ 0x330 in nrf91xx, 0x274 in nrf91xx_uicr
#   feed_wdt:                       @ clobbers r1-r3 and flags
#       ldr     r1, =0x50003860     @ SPU.PERIPHID[24].PERM (WDT)
#       ldr     r1, [r1]
#       ldr     r2, =0x40018000     @ WDT, non-secure alias
#       tst     r1, #0x10           @ SECATTR
#       it      ne
#       orrne   r2, r2, #0x10000000 @ WDT, secure alias
#       ldr     r1, [r2, #0x400]    @ RUNSTATUS
#       cmp     r1, #0
#       beq     2f
#       ldr     r1, [r2, #0x404]    @ REQSTATUS
#       add.w   r2, r2, #0x600      @ RR[0]
#       ldr     r3, =0x6E524635     @ reload request value
#   1:  lsrs    r1, r1, #1
#       it      cs
#       strcs   r3, [r2]
#       add.w   r2, r2, #4
#       bne     1b
#   2:  bx      lr
#       .ltorg
name: nRF91 Series
manufacturer:
  id: 0x44
  cc: 0x2
chip_detection:
- !NordicFicrInfo
  part_address: 0xff0140
  variant_address: 0xff0148
  part: 0x9160
  variants:
    0x41434953: nRF9160_xxAA # This is the B1A variant
- !NordicFicrInfo
  part_address: 0xff0140
  variant_address: 0xff0148
  part: 0x9161
  variants:
    0x4143414c: nRF9161_xxAA
- !NordicFicrInfo
  part_address: 0xff0140
  variant_address: 0xff0148
  part: 0x9151
  variants:
    0x4143414c: nRF9151_xxAA
pack_file_release: 8.59.0
variants:
- name: nRF9160_xxAA
  cores:
  - name: main
    type: armv8m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    name: FLASH
    range:
      start: 0x0
      end: 0x100000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Nvm
    name: UICR
    range:
      start: 0xff8000
      end: 0xff9000
    cores:
    - main
    access:
      write: false
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20040000
    cores:
    - main
  flash_algorithms:
  - nrf91xx
  - nrf91xx_uicr
- name: nRF9161_xxAA
  cores:
  - name: main
    type: armv8m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    name: FLASH
    range:
      start: 0x0
      end: 0x100000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Nvm
    name: UICR
    range:
      start: 0xff8000
      end: 0xff9000
    cores:
    - main
    access:
      write: false
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20040000
    cores:
    - main
  flash_algorithms:
  - nrf91xx
  - nrf91xx_uicr
- name: nRF9151_xxAA
  cores:
  - name: main
    type: armv8m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    name: FLASH
    range:
      start: 0x0
      end: 0x100000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Nvm
    name: UICR
    range:
      start: 0xff8000
      end: 0xff9000
    cores:
    - main
    access:
      write: false
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20040000
    cores:
    - main
  flash_algorithms:
  - nrf91xx
  - nrf91xx_uicr
flash_algorithms:
- name: nrf91xx
  description: nRF91xxx
  default: true
  instructions: 
  load_address: 0x20000008
  pc_init: 0x1
  pc_uninit: 0x41
  pc_program_page: 0x135
  pc_erase_sector: 0xb5
  pc_erase_all: 0x99
  pc_verify: 0x549
  data_section_offset: 0x524
  flash_properties:
    address_range:
      start: 0x0
      end: 0x200000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 3000
    sectors:
    - size: 0x1000
      address: 0x0
- name: nrf91xx_uicr
  description: nRF91xxx UICR Erase
  default: true
  instructions: 
  load_address: 0x20000008
  pc_init: 0x1
  pc_uninit: 0x35
  pc_program_page: 0x1b9
  pc_erase_sector: 0xa9
  pc_erase_all: 0x85
  pc_verify: 0x495
  data_section_offset: 0x470
  flash_properties:
    address_range:
      start: 0xff8000
      end: 0xff9000
    page_size: 0x4
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 3000
    sectors:
    - size: 0x1000
      address: 0x0
