  pc_init: 0x11d5
  pc_uninit: 0x1205
  pc_program_page: 0x1215
  pc_erase_sector: 0x120d
  pc_erase_all: 0x1209
  pc_verify: 0x11e3
  data_section_offset: 0x13a0
  flash_properties:
