name: CH571 / CH573 Series
chip_detection:
- !WchLink
  mask: 0xff000000
  variants:
    0x71000000: CH571
    0x73000000: CH573
variants:
- name: CH571
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x30000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20003800
      end: 0x20008000
    cores:
    - main
  flash_algorithms:
  - ch5xx-code-flash-192k
- name: CH573
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x70000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20003800
      end: 0x20008000
    cores:
    - main
  flash_algorithms:
  - ch5xx-code-flash-448k
flash_algorithms:
- name: ch5xx-code-flash-192k
  description: CH571 CodeFlash
  default: true
  instructions: 
  pc_init: 0x0
  pc_uninit: 0x4a
  pc_program_page: 0x222
  pc_erase_sector: 0x56
  pc_erase_all: 0x1b0
  data_section_offset: 0x400
  flash_properties:
    address_range:
      start: 0x0
      end: 0x30000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 500
    erase_sector_timeout: 1000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
- name: ch5xx-code-flash-448k
  description: CH573 CodeFlash
  default: true
  instructions: 
  pc_init: 0x0
  pc_uninit: 0x4a
  pc_program_page: 0x222
  pc_erase_sector: 0x56
  pc_erase_all: 0x1b0
  data_section_offset: 0x400
  flash_properties:
    address_range:
      start: 0x0
      end: 0x70000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 500
    erase_sector_timeout: 1000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
