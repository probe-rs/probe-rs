name: GD32H7 Series
pack_file_release: 1.5.0
variants:
- name: GD32H737VG
  cores:
  - name: main
    type: armv7em
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Ram
    name: ITCMRAM
    range:
      start: 0x0
      end: 0x80000
    cores:
    - main
  - !Nvm
    name: IROM1
    range:
      start: 0x08000000
      end: 0x08100000
    cores:
    - main
    access:
      write: false
      boot: true
  - !Ram
    name: DTCMRAM
    range:
      start: 0x20000000
      end: 0x20080000
    cores:
    - main
  - !Ram
    name: AXISRAM
    range:
      start: 0x24000000
      end: 0x24100000
    cores:
    - main
  - !Ram
    name: SRAM0
    range:
      start: 0x30000000
      end: 0x30004000
    cores:
    - main
  - !Ram
    name: SRAM1
    range:
      start: 0x30004000
      end: 0x30008000
    cores:
    - main
  flash_algorithms:
  - gd32h737-host

flash_algorithms:
- name: gd32h737-host
  description: Host-side FMC flash programming for GD32H737VG internal flash
  default: true
  flash_properties:
    address_range:
      start: 0x08000000
      end: 0x08100000
    page_size: 0x20
    erased_byte_value: 0xff
    program_page_timeout: 100
    erase_sector_timeout: 30000
    sectors:
    - size: 0x1000
      address: 0x0
