flash_algorithms:
- name: ch5xx-code-flash
  description: CH57X/CH58X/CH59X CodeFlash
  default: true
  instructions: 
  pc_init: 0x0
  pc_uninit: 0x4a
  pc_program_page: 0x222
  pc_erase_sector: 0x56
  pc_erase_all: 0x1b0
  data_section_offset: 0x400
  flash_properties:
    address_range:
      start: 0x0
      end: 0x70000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 500
    erase_sector_timeout: 1000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
- name: ch570-code-flash
  description: CH570/CH572 CodeFlash
  default: true
  instructions: 
  load_address: 0x20000008
  pc_init: 0x0
  pc_uninit: 0x18
  pc_program_page: 0x284
  pc_erase_sector: 0x24
  pc_erase_all: 0x25a
  data_section_offset: 0x548
  flash_properties:
    address_range:
      start: 0x0
      end: 0x3c000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 100
    erase_sector_timeout: 1000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
