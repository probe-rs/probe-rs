name: CH57X / CH58X / CH59X Series
chip_detection:
- !WchLink
  # Only used when the probe firmware reports a chip id in its `AttachChip`
  # response. A reported chip id of 0 matches nothing here, so `--chip` is
  # required.
  mask: 0xff000000
  variants:
    0x70000000: CH570
    0x71000000: CH571
    0x72000000: CH572
    0x73000000: CH573
    0x81000000: CH581
    0x82000000: CH582
    0x83000000: CH583
    0x91000000: CH591
    0x92000000: CH592
variants:
- name: CH570
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x3c000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20003000
    cores:
    - main
  flash_algorithms:
  - ch570-code-flash
- name: CH571
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x30000
    cores:
    - main
  - !Ram
    name: RAM
    range:
      start: 0x20003800
      end: 0x20008000
    cores:
    - main
  flash_algorithms:
  - ch5xx-code-flash
- name: CH572
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
