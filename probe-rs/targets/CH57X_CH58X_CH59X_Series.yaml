- name: CH585
  cores:
  - name: main
    type: riscv
    core_access_options: !Riscv
      hart_id: 0
  memory_map:
  # Code flash: 448 KiB, erased in 4 KiB blocks, programmed a dword at a time.
  # The data flash that follows it (32 KiB at 0x70000) is not mapped: it is
  # reached through the ISP library and is not readable in the code address
  # space, so exposing it as a loadable region would be misleading.
  - !Nvm
    name: CodeFlash
    range:
      start: 0x0
      end: 0x70000
    cores:
    - main
  # 128 KiB (96 KiB + 32 KiB retention) at 0x20000000.
  - !Ram
    name: RAM
    range:
      start: 0x20000000
      end: 0x20020000
    cores:
    - main
  flash_algorithms:
  - ch5xx-code-flash
- name: CH591
  cores:
  - name: main
