name: Atmosic ATM34
variants:
- name: ATM3430e
  cores:
  - name: main
    type: armv8m
    core_access_options: !Arm
      ap: !v1 1
  memory_map:
  - !Nvm
    name: RRAM_S
    range:
      start: 0x10010000
      end: 0x1008f800
    cores:
    - main
    access:
      boot: true
  - !Ram
    name: SRAM_NS_RTT
    range:
      start: 0x20000000
      end: 0x20040000
    cores:
    - main
  - !Ram
    name: SRAM_S
    range:
      start: 0x30000000
      end: 0x30040000
    cores:
    - main
  flash_algorithms:
  - atm34-rram
flash_algorithms:
- name: atm34-rram
  description: ATM34 RRAM
  default: true
  instructions: 
  load_address: 0x30000020
  pc_init: 0x67
  pc_uninit: 0x1c1
  pc_program_page: 0xf9
  pc_erase_sector: 0x1
  data_section_offset: 0x21c
  flash_properties:
    address_range:
      start: 0x10010000
      end: 0x1008f800
    page_size: 0x800
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 1000
    sectors:
    - size: 0x800
      address: 0x0
  cores:
  - main
