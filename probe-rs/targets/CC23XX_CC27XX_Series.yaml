name: CC23XX CC27XX Series
manufacturer:
  id: 0x17
  cc: 0x0
chip_detection:
# PARTID values from driverlib's chipinfo.h.
- !TiCfgAp
  variants:
    0x012dda: CC2340R5 # CC2340R52E0RGER
    0x3b2dda: CC2340R5 # CC2340R52E0RKPR
    0x0f2dda: CC2340R5 # CC2340R52E0WRHBRQ1
    0xe8af23: CC2745R10Q1
    0x9d6301: CC2755P10 # CC2755R105E0WRHAR, same memory
    0xe66301: CC2755P10 # CC2755P105E0WRHAR
variants:
- name: CC2340R5
  cores:
  - name: main
    type: armv6m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x0
      end: 0x80000
    cores:
    - main
    access:
      boot: true
  - !Ram
    range:
      start: 0x20000000
      end: 0x20009000
    cores:
    - main
  - !Nvm
    range:
      start: 0x4e020000
      end: 0x4e020800
    cores:
    - main
    access:
      execute: false
  flash_algorithms:
  - cc23xx-flash
- name: CC2745R10Q1
  cores:
  - name: main
    type: armv8m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x0
      end: 0x100000
    cores:
    - main
    access:
      boot: true
  - !Ram
    range:
      start: 0x20000000
      end: 0x20024000
    cores:
    - main
  - !Nvm
    range:
      start: 0x4e020000
      end: 0x4e020800
    cores:
    - main
    access:
      boot: false
      execute: false
  - !Nvm
    range:
      start: 0x4e040000
      end: 0x4e040400
    cores:
    - main
    access:
      boot: false
      execute: false
  flash_algorithms:
  - cc27xx-flash
  - cc27xx-flash-scfg

- name: CC2755P10
  cores:
  - name: main
    type: armv8m
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x0
      end: 0xe8000
    cores:
    - main
    access:
      boot: true
  - !Ram
    range:
      start: 0x20000000
      end: 0x20028800
    cores:
    - main
  - !Nvm
    range:
      start: 0x4e020000
      end: 0x4e020800
    cores:
    - main
    access:
      boot: false
      execute: false
  - !Nvm
    range:
      start: 0x4e040000
      end: 0x4e040400
    cores:
    - main
    access:
      boot: false
      execute: false
  flash_algorithms:
  - cc27xx-flash
  - cc27xx-flash-scfg

flash_algorithms:
- name: cc23xx-flash
  description: Host-side flash programming via SACI commands for CC23xx devices
  default: true
  flash_properties:
    address_range:
      start: 0x0
      end: 0x4e020800
    page_size: 0x800
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x800
      address: 0x0
    - size: 0x800
      address: 0x4e020000
  cores:
  - main
# Flash algorithm for CC27xx devices: calls the boot ROM's flash functions
# (https://github.com/raphaelcoeffic/cc27xx-flash). Without the AHB-AP, or when
# the image changes the SCFG, the flash sequence programs through SACI instead.
- name: cc27xx-flash
  description: Flash algorithm for CC27xx devices
  default: true
  instructions: 
  load_address: 0x20000020
  pc_init: 0x3f
  pc_uninit: 0x137
  pc_program_page: 0x95
  pc_erase_sector: 0x1
  vendor_functions:
    Signatures_md5: 0x16f
  data_section_offset: 0x1110
  flash_properties:
    address_range:
      start: 0x0
      end: 0x4e020800
    page_size: 0x800
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x800
      address: 0x0
  cores:
  - main
# The same algorithm for the SCFG, whose sector is 0x400 bytes.
- name: cc27xx-flash-scfg
  description: Flash algorithm for the SCFG of CC27xx devices
  default: true
  instructions: 
  load_address: 0x20000020
  pc_init: 0x3f
  pc_uninit: 0x137
  pc_program_page: 0x95
  pc_erase_sector: 0x1
  vendor_functions:
    Signatures_md5: 0x16f
  data_section_offset: 0x1110
  flash_properties:
    address_range:
      start: 0x4e040000
      end: 0x4e040400
    page_size: 0x400
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x400
      address: 0x0
  cores:
  - main
