name: ASR6601 Series
variants:
- name: ASR6601CB
  cores:
  - name: main
    type: armv7em
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x8000000
      end: 0x8020000
    cores:
    - main
    access:
      boot: true
  - !Ram
    range:
      start: 0x20000000
      end: 0x20004000
    cores:
    - main
  flash_algorithms:
  - asr6601_flashalgo

- name: ASR6601SE
  cores:
  - name: main
    type: armv7em
    core_access_options: !Arm
      ap: !v1 0
  memory_map:
  - !Nvm
    range:
      start: 0x8000000
      end: 0x8040000
    cores:
    - main
    access:
      boot: true
  - !Ram
    range:
      start: 0x20000000
      end: 0x20010000
    cores:
    - main
  flash_algorithms:
  - asr6601_flashalgo

flash_algorithms:
- name: asr6601_flashalgo
  description: A flash algorithm under test
  default: true
  instructions: 
  load_address: 0x20000020
  pc_init: 0x71
  pc_uninit: 0x2c9
  pc_program_page: 0xf9
  pc_erase_sector: 0x55
  pc_erase_all: 0x1
  pc_verify: 0x2f5
  data_section_offset: 0x2748
  rtt_location: 0x2000272c
  flash_properties:
    address_range:
      start: 0x8000000
      end: 0x8040000
    page_size: 0x1000
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - main
