# Comment the benchmark changes on the PR.
#
# The smoke test runs with a read-only token for PRs from forks. This workflow runs on the default
# branch with write access. The report artifact comes from PR code: use it only as data.

on:
  workflow_run:
    workflows: ["Run smoke test"]
    types: [completed]

name: Benchmark comment

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - uses: actions/download-artifact@v8
        id: download
        continue-on-error: true
        with:
          name: benchmark-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report

      - name: Create or update the comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(cat report/pr)
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number"
            exit 1
          fi
          # Comment only on the PR that the run tested.
          if [ "$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha)" != "$HEAD_SHA" ]; then
            echo "The PR head is not the tested commit"
            exit 0
          fi

          marker='<!-- probe-rs-benchmark -->'
          ids=$(gh api --paginate "repos/$GH_REPO/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          id=${ids%%$'\n'*}

          if [ -f report/comment.md ]; then
            body=report/comment.md
          elif [ -n "$id" ]; then
            body=no-change.md
            printf '%s\n## Probe benchmark\n\nNo results changed by more than the noise threshold.\n' "$marker" > "$body"
          else
            exit 0
          fi

          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh pr comment "$pr" --body-file "$body"
          fi
