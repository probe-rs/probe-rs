# Comment the benchmark changes on the PR.
#
# The smoke test runs with a read-only token for PRs from forks. This workflow runs on the default
# branch with write access. The report artifact comes from PR code: use it only as data.

on:
  workflow_run:
    workflows: ["Run smoke test"]
    types: [completed]

name: Benchmark comment

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - uses: actions/download-artifact@v8
        id: download
        continue-on-error: true
        with:
          name: benchmark-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report

      # The PR number comes from the artifact. Use it only if the PR head is the tested commit.
      - name: Check the PR number
        id: pr
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(cat report/pr)
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "Invalid PR number"
            exit 1
          fi
          if [ "$(gh api "repos/$GH_REPO/pulls/$pr" --jq .head.sha)" != "$HEAD_SHA" ]; then
            echo "The PR head is not the tested commit"
            exit 0
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - name: Comment the changes
        if: steps.pr.outputs.number && hashFiles('report/comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: probe-rs-benchmark
          number_force: ${{ steps.pr.outputs.number }}
          path: report/comment.md

      - name: Clear an earlier comment
        if: steps.pr.outputs.number && hashFiles('report/comment.md') == ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: probe-rs-benchmark
          number_force: ${{ steps.pr.outputs.number }}
          only_update: true
          message: |
            ## Probe benchmark

            No results changed by more than the noise threshold.
