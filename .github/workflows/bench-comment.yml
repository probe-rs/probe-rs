# Comment the benchmark changes on the PR.
#
# The smoke test runs with a read-only token for PRs from forks. This workflow runs on the default
# branch with write access. The report artifact comes from PR code: use it only as data.

on:
  workflow_run:
    workflows: ["Run smoke test"]
    types: [completed]

name: Benchmark comment

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      # Find the open PR whose head is the tested commit.
      - name: Find the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.event.workflow_run.head_repository.owner.login }}:${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api -X GET "repos/$GH_REPO/pulls" -f state=open -f head="$HEAD" \
            --jq '[.[] | select(.head.sha == env.HEAD_SHA)][0].number // empty')
          echo "number=$pr" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.pr.outputs.number
        continue-on-error: true
        with:
          name: benchmark-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: report

      - name: Note a missing report
        if: steps.pr.outputs.number && hashFiles('report/comment.md', 'report/clear.md') == ''
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          mkdir -p report
          printf '## Probe benchmark\n\nNo benchmark report. See [the run](%s).\n' "$RUN_URL" > report/clear.md

      - name: Comment the changes
        if: steps.pr.outputs.number && hashFiles('report/comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: probe-rs-benchmark
          number_force: ${{ steps.pr.outputs.number }}
          path: report/comment.md

      - name: Clear an earlier comment
        if: steps.pr.outputs.number && hashFiles('report/comment.md') == ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: probe-rs-benchmark
          number_force: ${{ steps.pr.outputs.number }}
          only_update: true
          path: report/clear.md
