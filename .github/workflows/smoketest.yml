on:
  push:
    branches: [master, staging, trying]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

name: Run smoke test

env:
  CARGO_INCREMENTAL: 0

jobs:
  build-smoke-tester:
    # Skip the slow hardware tests on draft PRs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04-arm
    # A new run of the same PR, branch, or tag cancels this job.
    concurrency:
      cancel-in-progress: true
      group: ${{ github.workflow }}-build-smoke-tester-${{ github.event.pull_request.number || github.ref }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install target for cross-compilation
        run: rustup target add aarch64-unknown-linux-musl

      - uses: taiki-e/install-action@nextest

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.9.2

      - name: Show rust info
        run: rustup show

      - name: Build smoke-tester
        run: cargo nextest archive --release --target aarch64-unknown-linux-musl -p smoke_tester --archive-file smoke_tester.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: smoke_tester
          path: smoke_tester.tar.zst

  build-probe-rs:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # A new run of the same PR, branch, or tag cancels this job.
    concurrency:
      cancel-in-progress: true
      group: ${{ github.workflow }}-build-probe-rs-${{ github.event.pull_request.number || github.ref }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install target for cross-compilation
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install cross
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cross

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build probe-rs
        run: cross build --release --target aarch64-unknown-linux-gnu -p probe-rs-tools

      - uses: actions/upload-artifact@v7
        with:
          name: probe-rs
          path: target/aarch64-unknown-linux-gnu/release/probe-rs

  test:
    runs-on: ["self-hosted", "linux", "ARM64", "${{ matrix.runner }}"]
    # Do not cancel a running hardware job: that can leave the boards in a bad state.
    # A new run of the same PR, branch, or tag waits for it.
    concurrency:
      cancel-in-progress: false
      group: ${{ github.workflow }}-test-${{ matrix.runner }}-${{ github.event.pull_request.number || github.ref }}
    strategy:
      fail-fast: false
      matrix:
        runner: ["smoke-tester-2", "probe-rs-tester-0"]

    needs: build-smoke-tester

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # There is a conflict between the probe-rs/ subfolder and the probe-rs binary artifact, if the
          # checkout is done into the workspace root.
          path: src/

      - uses: taiki-e/install-action@nextest

      - uses: actions/download-artifact@v8
        with:
          name: smoke_tester

      - name: Run smoke-tester
        run: |
          cargo-nextest nextest run --archive-file smoke_tester.tar.zst --profile ci-hardware --workspace-remap $GITHUB_WORKSPACE/src

  embedded-test:
    runs-on: ["self-hosted", "linux", "ARM64", "${{ matrix.runner }}"]
    # Do not cancel a running hardware job: that can leave the boards in a bad state.
    # A new run of the same PR, branch, or tag waits for it.
    concurrency:
      cancel-in-progress: false
      group: ${{ github.workflow }}-embedded-test-${{ matrix.runner }}-${{ github.event.pull_request.number || github.ref }}
    strategy:
      matrix:
        runner: ["smoke-tester-2"]

    needs: build-probe-rs

    steps:
      # Avoid conflicts when downloading the probe-rs artifact
      - name: Clean workspace
        run: rm -rf "${GITHUB_WORKSPACE}/*"

      - uses: actions/download-artifact@v8
        with:
          name: probe-rs

      - name: Run embedded-tests
        run: |
          chmod +x probe-rs
          if [ -n "$EMBEDDED_TEST_RUNNER" ]; then
            . $EMBEDDED_TEST_RUNNER
          fi
