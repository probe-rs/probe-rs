on:
  push:
    branches: [master, staging, trying]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

name: Run smoke test

env:
  CARGO_INCREMENTAL: 0

jobs:
  build-smoke-tester:
    # Skip the slow hardware tests on draft PRs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04-arm
    # A new run of the same PR, branch, or tag cancels this job.
    concurrency:
      cancel-in-progress: true
      group: ${{ github.workflow }}-build-smoke-tester-${{ github.event.pull_request.number || github.ref }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install target for cross-compilation
        run: rustup target add aarch64-unknown-linux-musl

      - uses: taiki-e/install-action@nextest

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Show rust info
        run: rustup show

      - name: Build smoke-tester
        run: cargo nextest archive --release --target aarch64-unknown-linux-musl -p smoke_tester --archive-file smoke_tester.tar.zst

      - uses: actions/upload-artifact@v7
        with:
          name: smoke_tester
          path: smoke_tester.tar.zst

  build-probe-rs:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # A new run of the same PR, branch, or tag cancels this job.
    concurrency:
      cancel-in-progress: true
      group: ${{ github.workflow }}-build-probe-rs-${{ github.event.pull_request.number || github.ref }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install target for cross-compilation
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install cross
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: cross

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build probe-rs
        run: cross build --release --target aarch64-unknown-linux-gnu -p probe-rs-tools

      - uses: actions/upload-artifact@v7
        with:
          name: probe-rs
          path: target/aarch64-unknown-linux-gnu/release/probe-rs

  test:
    runs-on: ["self-hosted", "linux", "ARM64", "${{ matrix.runner }}"]
    # Do not cancel a running hardware job: that can leave the boards in a bad state.
    # A new run of the same PR, branch, or tag waits for it.
    concurrency:
      cancel-in-progress: false
      group: ${{ github.workflow }}-test-${{ matrix.runner }}-${{ github.event.pull_request.number || github.ref }}
    strategy:
      fail-fast: false
      matrix:
        runner: ["smoke-tester-2", "probe-rs-tester-0"]

    needs: build-smoke-tester

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # There is a conflict between the probe-rs/ subfolder and the probe-rs binary artifact, if the
          # checkout is done into the workspace root.
          path: src/

      - uses: taiki-e/install-action@nextest

      - uses: actions/download-artifact@v8
        with:
          name: smoke_tester

      - name: Run smoke-tester
        env:
          SMOKE_TESTER_BENCH_OUT: ${{ github.workspace }}/bench.jsonl
        run: |
          rm -f "$SMOKE_TESTER_BENCH_OUT"
          cargo-nextest nextest run --archive-file smoke_tester.tar.zst --profile ci-hardware --workspace-remap "$GITHUB_WORKSPACE/src"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-${{ matrix.runner }}
          path: bench.jsonl
          if-no-files-found: ignore
          overwrite: true

  bench-report:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # The test jobs upload nothing if they fail early. The report then shows no results.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: bench-*
          path: bench

      # The baseline is the result of the nearest first-parent ancestor of the base commit.
      - name: Find the baseline
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git fetch -q --depth=20 origin "$BASE" && git fetch -q --depth=1 origin bench-data; then
            for sha in $(git rev-list --first-parent -n 20 "$BASE"); do
              if git show "FETCH_HEAD:$sha.jsonl" > baseline.jsonl 2> /dev/null; then
                echo "BASELINE_SHA=$sha" >> "$GITHUB_ENV"
                break
              fi
            done
          fi

      - name: Compare with the baseline
        run: |
          args=(--run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$BASELINE_SHA" ]; then
            args+=(--baseline baseline.jsonl --baseline-sha "$BASELINE_SHA")
          fi
          python3 smoke-tester/bench_report.py bench report "${args[@]}"
          cat report/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save the PR number
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "$PR" > report/pr

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: report
          overwrite: true

  bench-publish:
    needs: bench-report
    # Publish the results also if a test job failed.
    if: ${{ !cancelled() && needs.bench-report.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bench-data
      cancel-in-progress: false

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: benchmark-report
          path: ${{ runner.temp }}/report

      - name: Add the results to the bench-data branch
        run: |
          results="$RUNNER_TEMP/report/results.jsonl"
          [ -s "$results" ] || exit 0
          if git fetch -q --depth=1 origin bench-data; then
            git switch -q -c bench-data FETCH_HEAD
          else
            git switch -q --orphan bench-data
          fi
          cp "$results" "$GITHUB_SHA.jsonl"
          git add "$GITHUB_SHA.jsonl"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Add benchmark results for $GITHUB_SHA"
          git push -q origin bench-data

  embedded-test:
    runs-on: ["self-hosted", "linux", "ARM64", "${{ matrix.runner }}"]
    # Do not cancel a running hardware job: that can leave the boards in a bad state.
    # A new run of the same PR, branch, or tag waits for it.
    concurrency:
      cancel-in-progress: false
      group: ${{ github.workflow }}-embedded-test-${{ matrix.runner }}-${{ github.event.pull_request.number || github.ref }}
    strategy:
      matrix:
        runner: ["smoke-tester-2"]

    needs: build-probe-rs

    steps:
      # Avoid conflicts when downloading the probe-rs artifact
      - name: Clean workspace
        run: rm -rf "${GITHUB_WORKSPACE}/*"

      - uses: actions/download-artifact@v8
        with:
          name: probe-rs

      - name: Run embedded-tests
        run: |
          chmod +x probe-rs
          if [ -n "$EMBEDDED_TEST_RUNNER" ]; then
            . $EMBEDDED_TEST_RUNNER
          fi
